[package]
name = "lx-remote"
version = "0.1.0"
description = "Floating remote control for LX Music"
authors = ["you"]
edition = "2021"

[lib]
name = "lx_remote_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging"] }

[profile.release]
panic = "unwind"
codegen-units = 1
lto = true
opt-level = "s"
strip = true